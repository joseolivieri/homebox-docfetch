# Go build/vet/test on every push and pull request. The docker workflow only
# runs on main, so without this a PR carried no validation at all.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      # Live tests (llm/*_live_test.go) are skipped without an API key, so the
      # suite stays hermetic in CI. -race catches the concurrency bugs that
      # matter here: the portal and scanner share one process and one store.
      - name: test
        run: go test -race ./...
